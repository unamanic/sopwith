<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sopwith</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; border: 1px solid #333; }
    #hud {
      color: #ccc; font-family: monospace; font-size: 13px;
      width: 1200px; display: flex; align-items: center;
      justify-content: space-between; padding: 4px 8px; background: #111;
    }
    #hud-left  { display: flex; gap: 20px; }
    #hud-right { display: flex; align-items: center; gap: 12px; }
    #btn-sound {
      background: #222; border: 1px solid #444; color: #ccc;
      font-family: monospace; font-size: 12px; padding: 2px 8px;
      cursor: pointer; border-radius: 3px; user-select: none;
    }
    #btn-sound:hover { background: #333; border-color: #666; }
    #btn-sound.muted { color: #666; border-color: #333; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="hud-left">
      <span id="hud-speed">SPD: 0</span>
      <span id="hud-alt">ALT: 0</span>
      <span id="hud-ammo">AMMO: 40</span>
      <span id="hud-bombs">BOMBS: 6</span>
      <span id="hud-score">SCORE: 0</span>
    </div>
    <div id="hud-right">
      <button id="btn-sound">🔊 SFX</button>
    </div>
  </div>
  <canvas id="canvas" width="1200" height="650"></canvas>
  <div style="color:#555; font-family:monospace; font-size:11px; margin-top:4px;">
    [W][S] Throttle &nbsp; [A][D] Pitch &nbsp; [Space] Fire &nbsp; [B] Bomb &nbsp; [L] Loop &nbsp; [Q] Quit &nbsp; [M] Mute
  </div>
  <script src="game.js"></script>
</body>
</html>
